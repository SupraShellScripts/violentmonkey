name: AMO Retrieval Disabled for Fork

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled inherited AMO workflow
        shell: bash
        run: |
          echo "The inherited upstream AMO retrieval and release mutation workflow is disabled."
          echo "A fork-owned Firefox signing flow must run from a reviewed least-privilege container with unique extension identity and explicit operator authorization."
