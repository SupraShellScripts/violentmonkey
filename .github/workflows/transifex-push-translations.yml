name: Transifex Push Disabled for Fork

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled translation push
        shell: bash
        run: |
          echo "The inherited pull-request-triggered Transifex push is disabled."
          echo "Translation publication requires a future stateless network-enabled tooling container, fork-owned token, local act validation, and explicit operator action."
