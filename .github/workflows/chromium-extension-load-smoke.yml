name: Smoke-load Workbench Chromium extension

on:
  push:
    branches:
      - maintenance/chromium-extension-load-smoke

permissions:
  contents: read

jobs:
  chromium-extension-load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE: 8dff7d8522007746cf1fe2e0edf05c9ab8651410
      EXPECTED_EXTENSION_ID: mlooodbpjdohbedafmodnmelbmdgmngk
      PLAYWRIGHT_VERSION: 1.62.1
      HUSKY: 0
    steps:
      - name: Check out exact landed public source
        uses: actions/checkout@v4
        with:
          ref: 8dff7d8522007746cf1fe2e0edf05c9ab8651410
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          node --version
          pnpm --version

      - name: Install project dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build exact Chromium Workbench artifact
        shell: bash
        run: pnpm build:workbench:chromium

      - name: Install isolated pinned Playwright runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/workbench-playwright"
          cd "$RUNNER_TEMP/workbench-playwright"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Load extension and verify browser-visible identity
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/workbench-playwright/smoke.js" <<'NODE'
          'use strict';
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          (async () => {
            const extensionPath = path.resolve(process.env.GITHUB_WORKSPACE, 'dist-mv3');
            const context = await chromium.launchPersistentContext('', {
              channel: 'chromium',
              headless: true,
              args: [
                `--disable-extensions-except=${extensionPath}`,
                `--load-extension=${extensionPath}`,
              ],
            });
            try {
              let [worker] = context.serviceWorkers();
              if (!worker) worker = await context.waitForEvent('serviceworker', { timeout: 20000 });
              const extensionId = new URL(worker.url()).host;
              if (extensionId !== process.env.EXPECTED_EXTENSION_ID) {
                throw new Error(`Expected extension ID ${process.env.EXPECTED_EXTENSION_ID}, got ${extensionId}`);
              }
              const observed = await worker.evaluate(() => ({
                runtimeId: chrome.runtime.id,
                manifest: chrome.runtime.getManifest(),
              }));
              if (observed.runtimeId !== process.env.EXPECTED_EXTENSION_ID) {
                throw new Error(`chrome.runtime.id mismatch: ${observed.runtimeId}`);
              }
              if (observed.manifest.manifest_version !== 3) {
                throw new Error(`Expected MV3, got ${observed.manifest.manifest_version}`);
              }
              if (!observed.manifest.permissions?.includes('nativeMessaging')) {
                throw new Error('Built browser-visible manifest lost nativeMessaging permission.');
              }
              const evidence = {
                schemaVersion: 1,
                status: 'PASS',
                sourceCommit: process.env.EXPECTED_SOURCE,
                runnerOs: process.env.RUNNER_OS,
                runnerArch: process.env.RUNNER_ARCH,
                playwrightVersion: process.env.PLAYWRIGHT_VERSION,
                extensionId,
                runtimeId: observed.runtimeId,
                manifestVersion: observed.manifest.manifest_version,
                nativeMessagingPermission: true,
                serviceWorkerUrl: worker.url(),
                claims: {
                  chromiumExtensionLoads: true,
                  pinnedDevelopmentIdentityObserved: true,
                  nativeMessagingManifestPermissionObserved: true,
                  nativeHostConnected: false,
                  controllerIngressExercised: false,
                  reconcileExercised: false,
                  browserExecutionAuthority: false,
                  authorityChange: false,
                },
              };
              fs.writeFileSync(
                path.join(process.env.GITHUB_WORKSPACE, 'chromium-extension-load-evidence.json'),
                `${JSON.stringify(evidence, null, 2)}\n`,
              );
              console.log(JSON.stringify(evidence));
            } finally {
              await context.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          cd "$RUNNER_TEMP/workbench-playwright"
          node smoke.js

      - name: Upload immutable smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: chromium-extension-load-${{ env.EXPECTED_SOURCE }}
          path: chromium-extension-load-evidence.json
          if-no-files-found: error
          retention-days: 14
