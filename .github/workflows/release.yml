name: Fork Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    name: Build unsigned release candidate locally
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout when running on GitHub
        if: ${{ env.ACT != 'true' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 100
          fetch-tags: true

      - name: Build and validate in the stateless toolchain
        shell: bash
        run: sh ./tools/container.sh ci

      - name: Publication safety notice
        shell: bash
        run: |
          echo "This workflow creates an unsigned local release candidate only."
          echo "It does not publish to AMO, Chrome Web Store, Edge Add-ons, or GitHub Releases."
          echo "Fork signing and publication require a separate reviewed least-privilege workflow."
