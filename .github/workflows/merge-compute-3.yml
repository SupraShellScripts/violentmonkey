name: Merge compute PR3

on:
  push:
    branches:
      - agent/merge-compute-3

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute deterministic PR3 merge
        shell: bash
        run: |
          set -euo pipefail
          FOUNDATION=e1bcf3cdb1c71e8db71b34a5421bd25827f0c1d8
          PR3=d92a3a6992e24ba8159bfc3ba2a6343c2f330b18
          git fetch --no-tags origin "$PR3"
          git merge --no-commit --no-ff "$PR3" || true

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n' '.github/workflows/ci.yml' '_locales/en/messages.yml' | sort)"
          test "$conflicts" = "$expected"

          git checkout --ours .github/workflows/ci.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          old = '      - agent/stateless-container-builds\n'
          new = "      - 'agent/**'\n"
          if s.count(old) != 1:
              raise SystemExit(f'expected one CI branch trigger, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY

          git checkout --theirs _locales/en/messages.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_locales/en/messages.yml')
          s = p.read_text()
          if 'userScriptsPermissionNote:' in s or 'userScriptsPermissionNoteOld:' in s:
              raise SystemExit('upstream permission-note block unexpectedly already present')
          marker = 'valueLabelKey:\n'
          block = '''userScriptsPermissionNote:\n  description: Text in the popup or dashboard.\n  message: >-\n    Please enable "Allow User Scripts" in details for Violentmonkey in\n    chrome://extensions and reload the tab\nuserScriptsPermissionNoteOld:\n  description: Text in the popup or dashboard in older browsers.\n  message: Please enable "Developer Mode" in chrome://extensions and reload the tab\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'expected one valueLabelKey marker, found {s.count(marker)}')
          p.write_text(s.replace(marker, block + marker))
          PY

          git add .github/workflows/ci.yml _locales/en/messages.yml
          git rm -f .github/workflows/merge-compute-3.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check

          actual="$(git diff --cached --name-only "$FOUNDATION" | sort)"
          expected_files="$(cat <<'EOF' | sort
          .github/workflows/ci.yml
          _locales/en/messages.yml
          src/background/index.js
          src/background/utils/developer-mode.js
          src/common/developer-mode-transport.js
          src/common/developer-mode.js
          src/common/options-defaults.js
          src/manifest.yml
          src/options/views/tab-settings/index.vue
          src/options/views/tab-settings/vm-developer-mode.vue
          test/common/developer-mode-transport.test.js
          test/common/developer-mode.test.js
          EOF
          )"
          test "$actual" = "$expected_files"

          mkdir -p merge-output/.github/workflows merge-output/_locales
          cp .github/workflows/ci.yml merge-output/.github/workflows/ci.yml
          cp _locales/en/messages.yml merge-output/_locales/en.messages.yml
          git write-tree > merge-output/tree.txt
          git diff --cached --stat "$FOUNDATION" > merge-output/stat.txt
          git diff --cached --name-only "$FOUNDATION" > merge-output/files.txt
          git diff --cached "$FOUNDATION" -- .github/workflows/ci.yml _locales/en/messages.yml > merge-output/resolutions.diff
          printf '%s\n' "$FOUNDATION" > merge-output/foundation.txt
          printf '%s\n' "$PR3" > merge-output/pr3.txt

      - name: Upload resolved merge bytes
        uses: actions/upload-artifact@v7
        with:
          name: pr3-merge-compute
          path: merge-output/
          if-no-files-found: error
          retention-days: 1
