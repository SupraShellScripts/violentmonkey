name: Experimental Workbench browser-load smoke

on:
  push:
    branches:
      - maintenance/browser-load-smoke

permissions:
  contents: read

jobs:
  chromium-load-smoke:
    runs-on: windows-latest
    env:
      EXPECTED_SOURCE: 8dff7d8522007746cf1fe2e0edf05c9ab8651410
      EXPECTED_EXTENSION_ID: mlooodbpjdohbedafmodnmelbmdgmngk
      HUSKY: 0
      PUPPETEER_CACHE_DIR: ${{ runner.temp }}\puppeteer
    steps:
      - name: Check out exact landed source
        uses: actions/checkout@v4
        with:
          ref: 8dff7d8522007746cf1fe2e0edf05c9ab8651410
          fetch-depth: 1

      - name: Verify exact landed source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE) {
            throw "Expected landed source $($env:EXPECTED_SOURCE), got $actual"
          }

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          pnpm --version

      - name: Install and build Chromium Workbench extension
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm build:workbench:chromium
          if (-not (Test-Path 'dist-mv3/manifest.json')) {
            throw 'Chromium Workbench manifest was not produced.'
          }

      - name: Prepare pinned supported browser harness
        shell: pwsh
        run: |
          $harness = Join-Path $env:RUNNER_TEMP 'vmwb-puppeteer'
          New-Item -ItemType Directory -Force -Path $harness | Out-Null
          Push-Location $harness
          try {
            npm init -y | Out-Null
            npm install --save-exact --no-audit --no-fund puppeteer@24.8.1
          } finally {
            Pop-Location
          }

      - name: Load exact extension with Puppeteer and probe runtime
        shell: pwsh
        run: |
          $harness = Join-Path $env:RUNNER_TEMP 'vmwb-puppeteer'
          $script = Join-Path $harness 'smoke.cjs'
          $extensionPath = (Resolve-Path 'dist-mv3').Path
          $evidencePath = Join-Path $PWD 'browser-load-smoke.json'

          @'
          const fs = require('fs');
          const puppeteer = require('puppeteer');

          const extensionPath = process.env.VMWB_EXTENSION_PATH;
          const evidencePath = process.env.VMWB_EVIDENCE_PATH;
          const expectedId = process.env.EXPECTED_EXTENSION_ID;
          const expectedSource = process.env.EXPECTED_SOURCE;
          const expectedPrefix = `chrome-extension://${expectedId}/`;
          const optionsUrl = `${expectedPrefix}options/index.html#settings`;

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          (async () => {
            let browser;
            try {
              browser = await puppeteer.launch({
                headless: 'new',
                pipe: true,
                enableExtensions: [extensionPath],
              });

              const workerTarget = await browser.waitForTarget(
                target => target.type() === 'service_worker'
                  && target.url().startsWith(expectedPrefix),
                { timeout: 30000 },
              );
              const worker = await workerTarget.worker();
              assert(worker, 'Expected Workbench extension service worker was not available.');

              const workerProbe = await worker.evaluate(() => ({
                id: chrome.runtime.id,
                connectNative: typeof chrome.runtime.connectNative,
                manifestVersion: chrome.runtime.getManifest().manifest_version,
                version: chrome.runtime.getManifest().version,
                name: chrome.runtime.getManifest().name,
              }));

              assert(workerProbe.id === expectedId,
                `Worker runtime ID mismatch: expected ${expectedId}, got ${workerProbe.id}`);
              assert(workerProbe.connectNative === 'function',
                `Worker connectNative unavailable: ${workerProbe.connectNative}`);
              assert(workerProbe.manifestVersion === 3,
                `Expected MV3 worker, got manifest version ${workerProbe.manifestVersion}`);

              const page = await browser.newPage();
              await page.goto(optionsUrl, { waitUntil: 'domcontentloaded', timeout: 30000 });
              const pageProbe = await page.evaluate(() => ({
                href: location.href,
                id: chrome.runtime.id,
                connectNative: typeof chrome.runtime.connectNative,
                manifestVersion: chrome.runtime.getManifest().manifest_version,
                version: chrome.runtime.getManifest().version,
                name: chrome.runtime.getManifest().name,
              }));

              assert(pageProbe.href === optionsUrl,
                `Options href mismatch: expected ${optionsUrl}, got ${pageProbe.href}`);
              assert(pageProbe.id === expectedId,
                `Options runtime ID mismatch: expected ${expectedId}, got ${pageProbe.id}`);
              assert(pageProbe.connectNative === 'function',
                `Options connectNative unavailable: ${pageProbe.connectNative}`);
              assert(pageProbe.manifestVersion === 3,
                `Expected MV3 options page, got manifest version ${pageProbe.manifestVersion}`);

              const evidence = {
                schemaVersion: 3,
                status: 'PASS',
                sourceCommit: expectedSource,
                extensionId: expectedId,
                browser: await browser.version(),
                runner: process.platform,
                runId: process.env.GITHUB_RUN_ID,
                workerUrl: workerTarget.url(),
                workerProbe,
                optionsProbe: pageProbe,
                authorityChange: false,
                nativeHostRequired: false,
                harness: {
                  name: 'puppeteer',
                  version: require('puppeteer/package.json').version,
                  extensionLoading: 'enableExtensions',
                },
              };
              fs.writeFileSync(evidencePath, `${JSON.stringify(evidence, null, 2)}\n`);
            } finally {
              if (browser) await browser.close();
            }
          })().catch(err => {
            console.error(err && err.stack || err);
            process.exitCode = 1;
          });
          '@ | Set-Content -Encoding utf8 $script

          $env:VMWB_EXTENSION_PATH = $extensionPath
          $env:VMWB_EVIDENCE_PATH = $evidencePath
          Push-Location $harness
          try {
            node $script
          } finally {
            Pop-Location
          }

          if (-not (Test-Path $evidencePath)) {
            throw 'Puppeteer browser-load evidence was not produced.'
          }

      - name: Upload experimental browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: workbench-browser-load-smoke-${{ env.EXPECTED_SOURCE }}
          path: browser-load-smoke.json
          if-no-files-found: error
          retention-days: 14
