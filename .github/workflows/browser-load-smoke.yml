name: Experimental Workbench browser-load smoke

on:
  push:
    branches:
      - maintenance/browser-load-smoke

permissions:
  contents: read

jobs:
  chromium-load-smoke:
    runs-on: windows-latest
    env:
      EXPECTED_SOURCE: 8dff7d8522007746cf1fe2e0edf05c9ab8651410
      EXPECTED_EXTENSION_ID: mlooodbpjdohbedafmodnmelbmdgmngk
      HUSKY: 0
    steps:
      - name: Check out exact landed source
        uses: actions/checkout@v4
        with:
          ref: 8dff7d8522007746cf1fe2e0edf05c9ab8651410
          fetch-depth: 1

      - name: Verify exact landed source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE) {
            throw "Expected landed source $($env:EXPECTED_SOURCE), got $actual"
          }

      - name: Set up Node 24 and pnpm 11.20.0
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          pnpm --version

      - name: Install and build Chromium Workbench extension
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm build:workbench:chromium
          if (-not (Test-Path 'dist-mv3/manifest.json')) {
            throw 'Chromium Workbench manifest was not produced.'
          }

      - name: Ask Chrome to load exact unpacked extension
        shell: pwsh
        run: |
          function Get-CdpTargets {
            $response = Invoke-RestMethod 'http://127.0.0.1:9222/json/list' -TimeoutSec 5
            $items = [System.Collections.Generic.List[object]]::new()
            foreach ($target in $response) {
              $items.Add($target)
            }
            return $items.ToArray()
          }

          function Invoke-CdpEvaluate {
            param(
              [Parameter(Mandatory)] [string] $WebSocketUrl,
              [Parameter(Mandatory)] [string] $Expression
            )

            $socket = [System.Net.WebSockets.ClientWebSocket]::new()
            try {
              $socket.Options.SetRequestHeader('Origin', 'http://localhost')
              $socket.ConnectAsync([Uri]$WebSocketUrl, [Threading.CancellationToken]::None).GetAwaiter().GetResult()

              $request = @{
                id = 1
                method = 'Runtime.evaluate'
                params = @{
                  expression = $Expression
                  returnByValue = $true
                  awaitPromise = $true
                }
              } | ConvertTo-Json -Compress -Depth 5

              $bytes = [Text.Encoding]::UTF8.GetBytes($request)
              $segment = [ArraySegment[byte]]::new($bytes)
              $socket.SendAsync(
                $segment,
                [Net.WebSockets.WebSocketMessageType]::Text,
                $true,
                [Threading.CancellationToken]::None
              ).GetAwaiter().GetResult()

              $buffer = New-Object byte[] 65536
              $stream = [IO.MemoryStream]::new()
              do {
                $receiveSegment = [ArraySegment[byte]]::new($buffer)
                $received = $socket.ReceiveAsync(
                  $receiveSegment,
                  [Threading.CancellationToken]::None
                ).GetAwaiter().GetResult()
                if ($received.Count -gt 0) {
                  $stream.Write($buffer, 0, $received.Count)
                }
              } until ($received.EndOfMessage)

              $reply = [Text.Encoding]::UTF8.GetString($stream.ToArray()) | ConvertFrom-Json
              if ($reply.error) {
                throw "CDP Runtime.evaluate failed: $($reply.error | ConvertTo-Json -Compress)"
              }
              return $reply.result.result.value
            } finally {
              if ($socket.State -eq [Net.WebSockets.WebSocketState]::Open) {
                $socket.CloseAsync(
                  [Net.WebSockets.WebSocketCloseStatus]::NormalClosure,
                  'done',
                  [Threading.CancellationToken]::None
                ).GetAwaiter().GetResult()
              }
              $socket.Dispose()
            }
          }

          $chromeCandidates = @(
            (Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Google/Chrome/Application/chrome.exe')
          )
          $chrome = $chromeCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) {
            throw 'Google Chrome was not found on the hosted Windows runner.'
          }

          $dist = (Resolve-Path 'dist-mv3').Path
          $profile = Join-Path $env:RUNNER_TEMP 'vmwb-chrome-profile'
          New-Item -ItemType Directory -Force -Path $profile | Out-Null

          $args = @(
            '--headless=new',
            '--disable-gpu',
            '--no-first-run',
            '--no-default-browser-check',
            '--remote-debugging-port=9222',
            '--remote-allow-origins=*',
            "--user-data-dir=$profile",
            "--disable-extensions-except=$dist",
            "--load-extension=$dist",
            'about:blank'
          )

          $proc = Start-Process -FilePath $chrome -ArgumentList $args -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $null = Invoke-RestMethod 'http://127.0.0.1:9222/json/version' -TimeoutSec 2
                $ready = $true
                break
              } catch {}
            }
            if (-not $ready) {
              throw 'Chrome DevTools endpoint did not become ready.'
            }

            $targetsBefore = @(Get-CdpTargets)
            $expectedPrefix = "chrome-extension://$($env:EXPECTED_EXTENSION_ID)/"
            $extensionTargetsBefore = @(
              foreach ($target in $targetsBefore) {
                $url = [string]$target.url
                if ($url.StartsWith($expectedPrefix, [StringComparison]::Ordinal)) {
                  $target
                }
              }
            )

            $optionsUrl = "$($expectedPrefix)options/index.html"
            try {
              $null = Invoke-RestMethod -Method Put "http://127.0.0.1:9222/json/new?$([uri]::EscapeDataString($optionsUrl))" -TimeoutSec 5
            } catch {
              Write-Host "CDP target creation returned: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 2

            $targetsAfter = @(Get-CdpTargets)
            $extensionTargetsAfter = @(
              foreach ($target in $targetsAfter) {
                $url = [string]$target.url
                if ($url.StartsWith($expectedPrefix, [StringComparison]::Ordinal)) {
                  $target
                }
              }
            )
            $optionsTargets = @(
              foreach ($target in $extensionTargetsAfter) {
                if ([string]::Equals([string]$target.url, $optionsUrl, [StringComparison]::Ordinal)) {
                  $target
                }
              }
            )

            if ($optionsTargets.Count -ne 1) {
              Write-Host 'Chrome targets:'
              $targetsAfter | Select-Object type,title,url | Format-Table -AutoSize | Out-String | Write-Host
              throw "Expected exactly one loaded Workbench options target, found $($optionsTargets.Count)."
            }

            $optionsTarget = $optionsTargets[0]
            if (-not $optionsTarget.webSocketDebuggerUrl) {
              throw 'Expected extension options target has no CDP WebSocket endpoint.'
            }

            $runtimeProbe = Invoke-CdpEvaluate -WebSocketUrl ([string]$optionsTarget.webSocketDebuggerUrl) -Expression 'JSON.stringify({href:location.href,id:chrome.runtime.id,connectNative:typeof chrome.runtime.connectNative})'
            $probe = $runtimeProbe | ConvertFrom-Json

            if (-not [string]::Equals([string]$probe.href, $optionsUrl, [StringComparison]::Ordinal)) {
              throw "Unexpected extension page href: $($probe.href)"
            }
            if (-not [string]::Equals([string]$probe.id, $env:EXPECTED_EXTENSION_ID, [StringComparison]::Ordinal)) {
              throw "Chrome runtime ID mismatch: expected $($env:EXPECTED_EXTENSION_ID), got $($probe.id)"
            }
            if (-not [string]::Equals([string]$probe.connectNative, 'function', [StringComparison]::Ordinal)) {
              throw "chrome.runtime.connectNative unavailable in loaded Workbench extension: $($probe.connectNative)"
            }

            $evidence = [ordered]@{
              schemaVersion = 2
              status = 'PASS'
              sourceCommit = $env:EXPECTED_SOURCE
              extensionId = $env:EXPECTED_EXTENSION_ID
              browser = (Get-Item $chrome).VersionInfo.ProductVersion
              runner = $env:RUNNER_OS
              runId = $env:GITHUB_RUN_ID
              extensionTargetsBefore = @($extensionTargetsBefore | ForEach-Object { [string]$_.url })
              extensionTargetsAfter = @($extensionTargetsAfter | ForEach-Object { [string]$_.url })
              runtimeProbe = [ordered]@{
                href = [string]$probe.href
                id = [string]$probe.id
                connectNative = [string]$probe.connectNative
              }
              authorityChange = $false
              nativeHostRequired = $false
            }
            $evidence | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 browser-load-smoke.json
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload experimental browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: workbench-browser-load-smoke-${{ env.EXPECTED_SOURCE }}
          path: browser-load-smoke.json
          if-no-files-found: error
          retention-days: 14
