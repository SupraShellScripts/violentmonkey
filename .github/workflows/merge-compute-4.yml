name: Merge compute PR4

on:
  push:
    branches:
      - merge-compute-4

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Inspect PR4 merge
        shell: bash
        run: |
          set -euo pipefail
          BASE=3f9efb76f6808ebd59d4fb4825302da44f61cbea
          PR4=9f4e0506d9b7c53032e5aaea8545fd687533645b
          git config user.name 'merge-compute'
          git config user.email 'merge-compute@invalid.local'
          git fetch --no-tags origin "$PR4" "$BASE"
          git reset --hard "$BASE"
          set +e
          git merge --no-commit --no-ff "$PR4"
          merge_code=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          {
            echo '### PR4 merge inspection'
            echo "- merge exit: $merge_code"
            echo '- conflicts:'
            if test -n "$conflicts"; then
              printf '%s\n' "$conflicts" | sed 's/^/  - /'
            else
              echo '  - none'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if test -n "$conflicts"; then
            printf 'CONFLICTS\n%s\n' "$conflicts"
            exit 2
          fi
          test "$merge_code" -eq 0
          git diff --cached --check

          actual="$(git diff --cached --name-only "$BASE" | sort)"
          expected="$(cat <<'EOF' | sort
          .github/workflows/ci.yml
          docs/WORKBENCH_DEVELOPMENT_IDENTITY.md
          package.json
          scripts/manifest-helper.js
          scripts/workbench-dev-identity.js
          test/common/workbench-dev-identity.test.js
          tools/validate-workbench-dev-builds.sh
          EOF
          )"
          test "$actual" = "$expected"

          mkdir -p merge-output
          git write-tree > merge-output/tree.txt
          git diff --cached --stat "$BASE" > merge-output/stat.txt
          git diff --cached --name-only "$BASE" > merge-output/files.txt
          git diff --cached "$BASE" -- .github/workflows/ci.yml package.json scripts/manifest-helper.js > merge-output/overlap.diff

      - name: Upload merge evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr4-merge-compute
          path: merge-output/
          if-no-files-found: warn
          retention-days: 1
