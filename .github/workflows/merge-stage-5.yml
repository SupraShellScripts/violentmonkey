name: Stage synchronized PR5 merge

on:
  push:
    branches:
      - merge-stage-5

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and stage exact PR5 merge
        shell: bash
        run: |
          set -euo pipefail
          BASE=440842399357f98c0c36f5065657e270a841c360
          PR5=c653528212e4037292f164c8e5b162d8f2c1a126
          EXPECTED_TREE=3a6c55872ab07f64132b5c36e37c53d129c67df5
          TARGET=agent/issue-18-controlled-reconcile
          STAGED_REF=merge-staged-5-result

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "$TARGET" "$BASE" "$PR5"
          test "$(git rev-parse "origin/$TARGET")" = "$PR5"

          git reset --hard "$BASE"
          git merge --no-commit --no-ff "$PR5"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check

          actual="$(git diff --cached --name-only "$BASE" | sort)"
          expected="$(cat <<'EOF' | sort
          src/background/utils/developer-mode.js
          src/common/developer-mode-reconcile.js
          src/common/developer-mode-transport.js
          src/common/developer-mode.js
          test/common/developer-mode-reconcile.test.js
          test/common/developer-mode-transport.test.js
          test/common/developer-mode.test.js
          EOF
          )"
          test "$actual" = "$expected"

          tree="$(git write-tree)"
          test "$tree" = "$EXPECTED_TREE"

          message_file="$RUNNER_TEMP/pr5-message.txt"
          cat > "$message_file" <<'EOF'
          merge: carry controlled userscript reconcile onto qualified development identity

          Preserve the historically qualified PR #5 controlled-reconcile delta
          while carrying it onto exact PR #4. Git's three-way merge is conflict-free
          and the resulting parent delta remains exactly the seven historical PR #5
          paths. Reconcile remains capability/session/provenance/scope gated;
          browserExecution and postconditionObserved remain false, and
          runtime.execute-controlled remains unavailable.
          EOF
          merge_sha="$(git commit-tree "$tree" -p "$PR5" -p "$BASE" < "$message_file")"
          test "$(git rev-parse "$merge_sha^1")" = "$PR5"
          test "$(git rev-parse "$merge_sha^2")" = "$BASE"
          test "$(git rev-parse "$merge_sha^{tree}")" = "$EXPECTED_TREE"

          git push origin "$merge_sha:refs/heads/$STAGED_REF"
          git fetch --no-tags origin "$STAGED_REF"
          test "$(git rev-parse "origin/$STAGED_REF")" = "$merge_sha"

          echo "VERIFIED_MERGE_SHA=$merge_sha"
          {
            echo '### Staged synchronized PR #5 merge'
            echo "- historical head: $PR5"
            echo "- candidate qualified parent: $BASE"
            echo "- exact tree: $EXPECTED_TREE"
            echo "- staged merge commit: $merge_sha"
            echo "- production target remains unchanged: $TARGET"
          } >> "$GITHUB_STEP_SUMMARY"
