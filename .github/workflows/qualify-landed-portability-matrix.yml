name: Qualify landed Workbench extension portability matrix

on:
  push:
    branches:
      - maintenance/qualify-landed-portability-matrix

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_SOURCE: 8dff7d8522007746cf1fe2e0edf05c9ab8651410
      HUSKY: 0
    steps:
      - name: Check out exact landed public source
        uses: actions/checkout@v4
        with:
          ref: 8dff7d8522007746cf1fe2e0edf05c9ab8651410
          fetch-depth: 1

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE) {
            throw "Expected $($env:EXPECTED_SOURCE), got $actual"
          }

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          node --version
          pnpm --version
          pwsh --version

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run Developer Mode lifecycle regression
        shell: pwsh
        run: |
          $env:BABEL_ENV = 'test'
          $env:TEST = 'test'
          pnpm exec jest test/common/developer-mode.test.js --runInBand

      - name: Lint lifecycle files
        shell: pwsh
        run: pnpm exec eslint src/background/utils/developer-mode.js src/common/developer-mode.js test/common/developer-mode.test.js

      - name: Build Workbench Firefox development artifact
        shell: pwsh
        run: pnpm build:workbench:firefox

      - name: Build Workbench Chromium development artifact
        shell: pwsh
        run: pnpm build:workbench:chromium

      - name: Record OS-specific evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            schemaVersion = 1
            status = 'PASS'
            sourceCommit = $env:EXPECTED_SOURCE
            runnerOs = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            workflow = $env:GITHUB_WORKFLOW
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            node = (node --version).Trim()
            pnpm = (pnpm --version).Trim()
            powershell = ($PSVersionTable.PSVersion.ToString())
            checks = @(
              'exact-landed-source-identity',
              'developer-mode-lifecycle-regression',
              'lifecycle-lint',
              'workbench-firefox-build',
              'workbench-chromium-build'
            )
            claims = [ordered]@{
              extensionLifecyclePortable = $true
              developmentBuildPortable = $true
              nativeHostIntegration = $false
              controllerIngressPortable = $false
              browserE2EQualified = $false
              authorityChange = $false
            }
          }
          $name = "portability-$($env:RUNNER_OS)-$($env:RUNNER_ARCH).json"
          $evidence | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $name

      - name: Upload immutable OS evidence
        uses: actions/upload-artifact@v4
        with:
          name: landed-portability-${{ runner.os }}-${{ runner.arch }}-${{ env.EXPECTED_SOURCE }}
          path: portability-*.json
          if-no-files-found: error
          retention-days: 14
