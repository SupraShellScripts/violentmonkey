name: Transifex Pull Disabled for Fork

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled translation pull
        shell: bash
        run: |
          echo "The inherited scheduled Transifex pull is disabled."
          echo "Translation synchronization requires a future stateless network-enabled tooling container, fork-owned token, local act validation, and explicit operator action."
