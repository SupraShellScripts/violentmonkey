name: Fork Build and Test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - agent/stateless-container-builds
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: violentmonkey-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Container-only CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout when running on GitHub
        if: ${{ env.ACT != 'true' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 100
          fetch-tags: true
          persist-credentials: false

      - name: Run clean stateless toolchain
        shell: bash
        env:
          VM_NO_CACHE: "1"
          VM_REBUILD_TOOLCHAIN: "1"
        run: sh ./tools/container.sh ci

      - name: Summarize machine result
        if: always()
        shell: bash
        run: |
          if test -f artifacts/container/ci/run-result.json; then
            cat artifacts/container/ci/run-result.json
          else
            echo '{"schemaVersion":1,"status":"failure","message":"run-result.json missing"}'
            exit 1
          fi

      - name: Upload build and validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: violentmonkey-ci-${{ github.sha }}
          path: artifacts/container/ci/
          if-no-files-found: warn
          retention-days: 7
