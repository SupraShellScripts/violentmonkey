name: Local Heavy CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Container-only CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout when running on GitHub
        if: ${{ env.ACT != 'true' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 100
          fetch-tags: true

      - name: Run the stateless toolchain
        shell: bash
        run: |
          chmod +x tools/*.sh containers/toolchain/entrypoint.sh
          ./tools/container.sh ci

      - name: Summarize machine result
        if: always()
        shell: bash
        run: |
          if test -f artifacts/container/ci/run-result.json; then
            cat artifacts/container/ci/run-result.json
          else
            echo '{"schemaVersion":1,"status":"failure","message":"run-result.json missing"}'
            exit 1
          fi
