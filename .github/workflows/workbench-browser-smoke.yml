name: Workbench Chromium browser smoke

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'scripts/workbench-dev-identity.js'
      - 'tools/smoke-workbench-chromium.js'
      - 'tools/validate-workbench-dev-artifacts.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/workbench-browser-smoke.yml'
  push:
    branches:
      - 'agent/**'
    paths:
      - 'src/**'
      - 'scripts/workbench-dev-identity.js'
      - 'tools/smoke-workbench-chromium.js'
      - 'tools/validate-workbench-dev-artifacts.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/workbench-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-load:
    name: Chromium load (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      HUSKY: 0
      PLAYWRIGHT_VERSION: 1.62.1
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          node --version
          pnpm --version

      - name: Install project dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build Chromium Workbench artifact
        shell: pwsh
        run: pnpm build:workbench:chromium

      - name: Install isolated pinned Playwright runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'workbench-playwright'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Push-Location $runtime
          try {
            npm init -y | Out-Null
            npm install --no-audit --no-fund "playwright@$($env:PLAYWRIGHT_VERSION)"
            if ($env:RUNNER_OS -ceq 'Linux') {
              npx playwright install --with-deps chromium
            } else {
              npx playwright install chromium
            }
          } finally {
            Pop-Location
          }

      - name: Load extension and verify browser-visible identity
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'workbench-playwright'
          $env:VMWB_PLAYWRIGHT_MODULE = Join-Path $runtime 'node_modules/playwright'
          $env:VMWB_EXTENSION_PATH = Join-Path $env:GITHUB_WORKSPACE 'dist-mv3'
          $evidenceName = "workbench-chromium-smoke-$($env:RUNNER_OS)-$($env:RUNNER_ARCH).json"
          $env:VMWB_BROWSER_SMOKE_EVIDENCE = Join-Path $env:GITHUB_WORKSPACE $evidenceName
          node tools/smoke-workbench-chromium.js

      - name: Upload immutable browser smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: workbench-chromium-smoke-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: workbench-chromium-smoke-*.json
          if-no-files-found: error
          retention-days: 14
