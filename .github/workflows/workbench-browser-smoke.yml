name: Workbench Chromium browser smoke

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'scripts/workbench-dev-identity.js'
      - 'tools/smoke-workbench-chromium.js'
      - 'tools/validate-workbench-dev-artifacts.js'
      - 'tools/check-container-policy.sh'
      - 'tools/tooling-policy.json'
      - 'containers/toolchain/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/workbench-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Containerized Workbench Chromium build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build Chromium Workbench artifact in declared toolchain
        shell: bash
        run: sh ./tools/container.sh exec npm run build:workbench:chromium

      - name: Upload exact container-produced browser input
        uses: actions/upload-artifact@v4
        with:
          name: workbench-chromium-build-${{ github.sha }}
          path: artifacts/container/exec/
          if-no-files-found: error
          retention-days: 14

  chromium-load:
    name: Chromium load (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PLAYWRIGHT_VERSION: 1.62.1
    steps:
      - name: Check out source-only smoke harness
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact container-produced extension
        uses: actions/download-artifact@v4
        with:
          name: workbench-chromium-build-${{ github.sha }}
          path: browser-build

      - name: Verify transferred build evidence
        shell: pwsh
        run: |
          $result = Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'browser-build/run-result.json') | ConvertFrom-Json
          if ($result.status -cne 'success') { throw 'Containerized browser build did not report success.' }
          if ($result.sourceCommit -cne $env:GITHUB_SHA) {
            throw "Container build source mismatch: expected $($env:GITHUB_SHA), got $($result.sourceCommit)"
          }
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'browser-build/dist-mv3/manifest.json'
          if (-not (Test-Path -LiteralPath $manifest)) { throw 'Transferred Chromium manifest is missing.' }

      - name: Install isolated pinned host-native browser qualification runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'workbench-playwright'
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP 'playwright-browsers'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          npm install --prefix $runtime --no-audit --no-fund --no-save "playwright@$($env:PLAYWRIGHT_VERSION)" # host-bound-browser-qualification
          $cli = Join-Path $runtime 'node_modules/playwright/cli.js'
          if ($env:RUNNER_OS -ceq 'Linux') {
            node $cli install --with-deps chromium
          } else {
            node $cli install chromium
          }
          node --version
          node -e "console.log(require(process.argv[1]).version || 'playwright-loaded')" (Join-Path $runtime 'node_modules/playwright/package.json')

      - name: Load extension and verify browser-visible identity
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'workbench-playwright'
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP 'playwright-browsers'
          $env:VMWB_PLAYWRIGHT_MODULE = Join-Path $runtime 'node_modules/playwright'
          $env:VMWB_EXTENSION_PATH = Join-Path $env:GITHUB_WORKSPACE 'browser-build/dist-mv3'
          $evidenceName = "workbench-chromium-smoke-$($env:RUNNER_OS)-$($env:RUNNER_ARCH).json"
          $env:VMWB_BROWSER_SMOKE_EVIDENCE = Join-Path $env:GITHUB_WORKSPACE $evidenceName
          node tools/smoke-workbench-chromium.js

      - name: Upload immutable browser smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: workbench-chromium-smoke-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: workbench-chromium-smoke-*.json
          if-no-files-found: error
          retention-days: 14
