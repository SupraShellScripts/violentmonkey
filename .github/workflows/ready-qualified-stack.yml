name: Ready qualified stack

on:
  push:
    branches:
      - maintenance/ready-qualified-stack

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark exact qualified PRs ready
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pr in 1 3 4 5; do
            gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state,isDraft,headRefOid
          done

          test "$(gh pr view 1 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = e1bcf3cdb1c71e8db71b34a5421bd25827f0c1d8
          test "$(gh pr view 3 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = 3f9efb76f6808ebd59d4fb4825302da44f61cbea
          test "$(gh pr view 4 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = 440842399357f98c0c36f5065657e270a841c360
          test "$(gh pr view 5 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = 93b02d7532071e63425d6674bd2088d779a5a37e

          for pr in 1 3 4 5; do
            if test "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true; then
              gh pr ready "$pr" --repo "$GITHUB_REPOSITORY"
            fi
          done

          for pr in 1 3 4 5; do
            test "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          done
