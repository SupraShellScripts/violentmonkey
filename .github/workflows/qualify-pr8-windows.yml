name: Qualify PR8 exact head on Windows

on:
  push:
    branches:
      - maintenance/qualify-pr8-windows

permissions:
  contents: read

jobs:
  windows-qualification:
    runs-on: windows-latest
    env:
      EXPECTED_SOURCE: 6614bbb1a208c3cf8d604987cf93608077d76626
      HUSKY: 0
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@v4
        with:
          ref: 6614bbb1a208c3cf8d604987cf93608077d76626
          fetch-depth: 1

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE) {
            throw "Expected $($env:EXPECTED_SOURCE), got $actual"
          }

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          node --version
          pnpm --version

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run Developer Mode regression tests
        shell: pwsh
        run: |
          $env:BABEL_ENV = 'test'
          $env:TEST = 'test'
          pnpm exec jest test/common/developer-mode.test.js --runInBand

      - name: Lint changed lifecycle files
        shell: pwsh
        run: pnpm exec eslint src/background/utils/developer-mode.js src/common/developer-mode.js test/common/developer-mode.test.js

      - name: Build Workbench Firefox development artifact
        shell: pwsh
        run: pnpm build:workbench:firefox

      - name: Build Workbench Chromium development artifact
        shell: pwsh
        run: pnpm build:workbench:chromium

      - name: Record qualification evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            schemaVersion = 1
            status = 'PASS'
            sourceCommit = $env:EXPECTED_SOURCE
            runner = $env:RUNNER_OS
            workflow = $env:GITHUB_WORKFLOW
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            node = (node --version).Trim()
            pnpm = (pnpm --version).Trim()
            checks = @(
              'exact-source-identity',
              'developer-mode-regression-test',
              'changed-file-lint',
              'workbench-firefox-build',
              'workbench-chromium-build'
            )
            authorityChange = $false
          }
          $evidence | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 pr8-windows-qualification.json

      - name: Upload immutable run evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr8-windows-qualification-${{ env.EXPECTED_SOURCE }}
          path: pr8-windows-qualification.json
          if-no-files-found: error
          retention-days: 14
