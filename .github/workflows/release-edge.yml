name: Edge Publication Disabled for Fork

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled inherited publisher
        shell: bash
        run: |
          echo "The inherited upstream Edge publisher is disabled."
          echo "Build release candidates locally through nektos/act and the stateless toolchain."
          echo "A future fork-owned Edge publisher requires unique extension identity, reviewed credentials, and a least-privilege publication container."
